<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocolo Policial | Acesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="card">
      <div class="logo-box">
        <img
          src="assets/marca-protocolo-policial.jpeg"
          alt="Protocolo Policial Cursos"
          class="logo-protocolo"
        >
      </div>

      <h1>Acesso do candidato</h1>
      <p class="muted">Informe seus dados para acessar o simulado.</p>

      <form id="loginForm">
        <label for="nome">Nome completo</label>
        <input
          id="nome"
          type="text"
          placeholder="Digite seu nome"
          required
          minlength="2"
          autocomplete="name"
        >

        <label for="credencial">Credencial de acesso</label>
        <input
          id="credencial"
          type="password"
          required
          autocomplete="current-password"
        >

        <p id="erro" class="erro" role="alert"></p>

        <button type="submit">Entrar no simulado →</button>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
